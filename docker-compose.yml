version: '3.8'

services:
  second-brain:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: second_brain_app
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./sample_vault:/app/sample_vault
    environment:
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5-coder:3b-instruct
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - RERANKER_MODEL=ms-marco-TinyBERT-L-2-v2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/system/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
