name: CI / Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          uv venv
          uv pip install ruff mypy
          uv pip install -e ".[dev]"

      - name: Run Ruff Lint
        run: uv run ruff check backend/ tests/

      - name: Run Ruff Format Check
        run: uv run ruff format --check backend/ tests/

  test-suite:
    name: Automated Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run Pytest Suite with Coverage
        run: uv run pytest tests/ --cov=backend --cov-report=term-missing

  docker-build:
    name: Docker Image Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: second-brain:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-success:
    name: CI Test Suite Pass
    needs: [lint-and-typecheck, test-suite, docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: Gate Check
        run: echo "All linting, test suites, and Docker build gates passed."

